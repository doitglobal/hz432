name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please do not attach copyrighted audio files.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and the full console output. For tuning issues, add the `--analyze-only` output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hz432 version
      description: Output of `python hz432.py --version`
      placeholder: hz432.py 1.0.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.11.4
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Source file details (bitrate, sample rate, genre), anything else that may help.
