name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Windows build to (e.g. v1.0.0)
        required: true

permissions:
  contents: read

jobs:
  dist:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  exe:
    name: Windows executable
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile --name hz432 --collect-all librosa --collect-all pedalboard
          packaging/hz432_exe.py
      - name: Smoke test
        run: dist\hz432.exe --version
      - name: Attach to release
        run: |
          Move-Item dist\hz432.exe hz432-windows-x64.exe
          gh release upload $env:TAG hz432-windows-x64.exe --clobber

  pypi:
    name: Publish to PyPI
    needs: dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
